[project]
name = "aroundfm-backend"
version = "2.1.0"
description = "AroundFM radio API"
requires-python = ">=3.12,<3.13"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S", "SIM", "ASYNC", "RUF", "C4", "PIE", "PT", "T20", "DTZ", "LOG"]
ignore = ["E501", "E712", "B008", "S101", "S311", "RUF001", "RUF002", "RUF003", "RUF012", "PT011"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S107", "S108", "DTZ"]
"tests/conftest.py" = ["E402"]
"app/models/identity.py" = ["S105"]
"app/schemas/auth.py" = ["S105"]
"app/services/auth_service.py" = ["S106"]
"app/cli.py" = ["T201"]
"migrations/env.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
packages = ["app"]
strict_optional = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
no_implicit_optional = true
disallow_incomplete_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.api.*", "app.main"]
disallow_incomplete_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]

[tool.coverage.run]
source = ["app"]
branch = true
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
