limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=streams_per_ip:10m;
limit_conn_zone $server_name zone=streams_total:1m;

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    server_tokens off;
    client_max_body_size 64k;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/geo+json image/svg+xml;

    limit_req_status 429;
    limit_conn_status 429;

    include /etc/nginx/snippets/security-headers.conf;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection $connection_upgrade;

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter "__ORIGIN__" "$forwarded_proto://$http_host";
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        types { }
        default_type application/manifest+json;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /api/v1/internal/ {
        return 404;
    }

    location ~ ^/api/v1/stations/\d+/stream$ {
        limit_req zone=api_per_ip burst=120 nodelay;
        limit_conn streams_per_ip 10;
        limit_conn streams_total 300;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_pass http://backend:8000;
    }

    location ~ ^/api/v1/auth/(login|register|telegram|refresh)$ {
        limit_req zone=auth_per_ip burst=20 nodelay;
        proxy_pass http://backend:8000;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=120 nodelay;
        proxy_pass http://backend:8000/api/;
    }

    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://backend:8000;
    }
}
