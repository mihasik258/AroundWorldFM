# Per-client request budget for the API. A page load is ~5 requests; the
# numbers leave room for many people behind one NAT (a classroom, an office).
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
# Proxied audio streams are long-lived: each one holds a backend connection and
# an upstream radio connection for as long as someone listens.
limit_conn_zone $binary_remote_addr zone=streams_per_ip:10m;
limit_conn_zone $server_name zone=streams_total:1m;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    limit_req_status 429;
    limit_conn_status 429;

    # Inherited by both API locations below
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # nginx is the edge proxy: overwrite, never append. With
    # $proxy_add_x_forwarded_for a client-supplied header survives as the
    # leftmost entry and lets anyone pick their own IP for rate limiting.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Audio stream proxy: cap concurrent streams per client and in total
    location ~ ^/api/v1/stations/\d+/stream$ {
        limit_req zone=api_per_ip burst=120 nodelay;
        limit_conn streams_per_ip 10;
        limit_conn streams_total 300;
        proxy_buffering off;  # pass audio through as it arrives
        proxy_pass http://backend:8000;
    }

    # Proxy API requests to backend
    location /api/ {
        limit_req zone=api_per_ip burst=120 nodelay;
        proxy_pass http://backend:8000/api/;
    }
}
