limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=streams_per_ip:10m;
limit_conn_zone $server_name zone=streams_total:1m;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    limit_req_status 429;
    limit_conn_status 429;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/api/v1/stations/\d+/stream$ {
        limit_req zone=api_per_ip burst=120 nodelay;
        limit_conn streams_per_ip 10;
        limit_conn streams_total 300;
        proxy_buffering off;
        proxy_pass http://backend:8000;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=120 nodelay;
        proxy_pass http://backend:8000/api/;
    }
}
