services:
  db:
    image: postgres:16-alpine
    container_name: aroundfm_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aroundfm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aroundfm"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: aroundfm-backend:latest
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aroundfm_backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgrespassword@db:5432/aroundfm"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      SECRET_PEPPER: ${SECRET_PEPPER:?SECRET_PEPPER is required}
      CORS_ORIGINS: '["http://localhost:5173", "http://localhost:3000", "http://127.0.0.1:5173"]'
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    image: aroundfm-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aroundfm_frontend
    restart: unless-stopped
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
