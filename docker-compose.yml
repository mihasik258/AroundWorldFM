x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/aroundfm
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  SECRET_PEPPER: ${SECRET_PEPPER:?SECRET_PEPPER is required}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}
  SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
  LOG_JSON: ${LOG_JSON:-false}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  BOT_API_SECRET: ${BOT_API_SECRET:-}

services:
  db:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aroundfm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aroundfm"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: aroundfm-backend:latest
    build:
      context: ./backend
      target: runtime
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli seed"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    image: aroundfm-backend:latest
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    image: aroundfm-frontend:latest
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:8080"

  bot:
    image: aroundfm-bot:latest
    build:
      context: ./bot
      target: runtime
    restart: unless-stopped
    profiles: ["bot"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      BACKEND_URL: http://backend:8000
      BOT_API_SECRET: ${BOT_API_SECRET:-}
    depends_on:
      - backend

volumes:
  postgres_data:
